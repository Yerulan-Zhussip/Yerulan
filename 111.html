<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mercury Energy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: #f1f5f9;
            min-height: 100vh;
            color: #1e293b;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 1.5rem;
        }
        .bento-card {
            transition: all 0.2s ease-out;
        }
        .bento-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(59, 130, 246, 0.2);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .nav-btn, .primary-btn {
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .nav-btn:active, .primary-btn:active {
            transform: scale(0.96);
        }
        .page {
            animation: fadeSlideUp 0.35s ease-out;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .news-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 1.5rem;
            padding: 0.5rem 0 1.5rem 0;
            scrollbar-width: none;
        }
        .news-slider::-webkit-scrollbar {
            display: none;
        }
        .news-slide {
            flex: 0 0 85%;
            scroll-snap-align: start;
        }
        @media (min-width: 768px) {
            .news-slide {
                flex: 0 0 31%;
            }
        }
        .tank {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .tank:hover {
            transform: translateY(-5px);
        }
        .fuel-fill {
            transition: height 0.5s ease-out;
        }
        input {
            color: #1e293b;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .gradient-text {
            background: linear-gradient(135deg, #1e293b 0%, #3b82f6 50%, #6366f1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .home-btn {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #2563eb;
        }
        .home-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.3);
        }
        .small-nav-btn {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            color: #475569;
            transition: all 0.2s;
        }
        .small-nav-btn:hover {
            background: rgba(59, 130, 246, 0.05);
            border-color: rgba(59, 130, 246, 0.2);
            color: #2563eb;
            transform: translateY(-2px);
        }
        .hero-bg {
            background-image: url('https://mercuryenergy.kz/11.jpg');
            background-size: cover;
            background-position: center;
        }
        .chart-container canvas {
            max-height: 250px;
            width: 100%;
        }
        .logo-container {
            width: 40px;
            height: 40px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-img {
            max-width: none;
            height: 100%;
            margin-right: 150%;
            transform: scale(1.5);
        }
    </style>
</head>
<body class="antialiased">
<div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 relative">
    <header class="flex justify-between items-center mb-6 z-30 relative flex-wrap gap-3">
        <div class="flex items-center gap-3">
            <div class="logo-container rounded-lg">
                <img src="logo.png" class="logo-img" alt="Logo">
            </div>
            <div class="text-2xl font-bold tracking-tight">
                <span class="gradient-text">Mercury</span>
            </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <button id="homeButton" class="home-btn flex items-center gap-1 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-medium border transition-all nav-btn">
                <i class="fas fa-home text-xs"></i>
                <span>Главная</span>
            </button>
            <button data-nav="about" class="small-nav-btn flex items-center gap-1 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-medium border transition-all nav-page-btn">
                <i class="fas fa-building text-xs"></i>
                <span class="hidden sm:inline">О компании</span>
            </button>
            <button data-nav="tanks" class="small-nav-btn flex items-center gap-1 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-medium border transition-all nav-page-btn">
                <i class="fas fa-oil-can text-xs"></i>
                <span class="hidden sm:inline">АЗС / Нефтебаза</span>
            </button>
            <button data-nav="contacts" class="small-nav-btn flex items-center gap-1 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-medium border transition-all nav-page-btn">
                <i class="fas fa-phone text-xs"></i>
                <span class="hidden sm:inline">Контакты</span>
            </button>
            <a href="https://mercuryenergy.kz" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1 bg-white/10 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 hover:bg-gray-100 transition-all nav-btn text-blue-600">
                <i class="fas fa-external-link-alt text-xs"></i>
                <span class="hidden sm:inline">Сайт</span>
            </a>
        </div>
    </header>

    <main id="pageContent" class="page"></main>
</div>
<script>
    function combinations(n, k) { if (k < 0 || k > n) return 0; if (k === 0 || k === n) return 1; if (k > n / 2) k = n - k; let res = 1; for (let i = 1; i <= k; i++) res = res * (n - i + 1) / i; return Math.round(res); }
    function bernoulliProbability(n, k, p) { return combinations(n, k) * Math.pow(p, k) * Math.pow(1 - p, n - k); }

    const fuelPrices = {
        diesel: [
            { location: "Атырау (нефтебаза)", price: "285 ₸/л" },
            { location: "Актобе (нефтебаза)", price: "290 ₸/л" },
            { location: "Шымкент (нефтебаза)", price: "303 ₸/л" }
        ],
        aviationAndPetrol: [
            { name: "Авиатопливо (Jet A-1)", price: "по запросу" },
            { name: "Бензин АИ-92", price: "225 ₸/л" },
            { name: "Бензин АИ-95", price: "235 ₸/л" }
        ],
        updatedAt: "18 мая 2026 года"
    };

    const newsArchive = [
        { id: 1, title: "Модернизация нефтебазы JIG", content: "Поэтапная модернизация в соответствии с международными стандартами JIG 2 (issue 13, 2021).", date: "2025-04-20", trending: 92, img: "https://mercuryenergy.kz/upload/iblock/d7a/news.jpg" },
        { id: 2, title: "Практика студентов КазНУ", content: "Студенты 4-го курса КазНУ им. Аль-Фараби успешно прошли практику на нефтебазе.", date: "2026-04-30", trending: 88, img: "https://mercuryenergy.kz/upload/iblock/d7a/KZNU.jpeg" },
        { id: 3, title: "Меморандум с SCAT Airlines", content: "Соглашение о развитии инфраструктуры хранения авиатоплива и расширении сети поставок.", date: "2024-04-30", trending: 75, img: "https://mercuryenergy.kz/scat.jpeg" },
        { id: 4, title: "Запуск Smart АЗС ION Energy", content: "Инновационный проект 'умных' АЗС на модульной основе с цифровыми решениями.", date: "2025-03-15", trending: 94, img: "https://mercuryenergy.kz/upload/iblock/4b9/AZSION2.png" }
    ];

    let newsSortMode = 'newest';
    function formatDate(dateStr) { const d = new Date(dateStr); return `${d.getDate()} ${['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()]} ${d.getFullYear()}`; }
    function getSortedNews() {
        let arr = [...newsArchive];
        if (newsSortMode === 'newest') arr.sort((a,b) => new Date(b.date) - new Date(a.date));
        else if (newsSortMode === 'oldest') arr.sort((a,b) => new Date(a.date) - new Date(b.date));
        else arr.sort((a,b) => b.trending - a.trending);
        return arr;
    }

    function renderHome() {
        return `
            <div class="space-y-6">
                <div class="relative rounded-3xl overflow-hidden h-32 md:h-36 glass-card flex items-center justify-center hero-bg">
                    <div class="absolute inset-0 bg-white/20 backdrop-blur-[1px]"></div>
                    <div class="relative z-10 text-center px-4 max-w-2xl mx-auto">
                        <h1 class="text-4xl md:text-5xl font-bold text-slate-900 mb-1 leading-none">Mercury</h1>
                        <p class="text-slate-700 text-sm md:text-base italic mb-2">From the endless steppes to the eternal sky</p>
                        <div class="flex flex-wrap justify-center gap-2 text-[10px] sm:text-xs text-slate-800">
                            <span class="bg-white/40 border border-white/60 px-3 py-0.5 rounded-full backdrop-blur-md">Нефтебаза в Алматы</span>
                            <span class="bg-white/40 border border-white/60 px-3 py-0.5 rounded-full backdrop-blur-md">Авиатопливо</span>
                            <span class="bg-white/40 border border-white/60 px-3 py-0.5 rounded-full backdrop-blur-md">Хранение 19 000 м³</span>
                        </div>
                    </div>
                </div>

                <div class="glass-panel p-6 rounded-2xl">
                    <div class="text-center mb-4">
                        <h2 class="text-xl font-bold flex items-center justify-center gap-2 text-blue-600">
                            <i class="fas fa-tags"></i> Топливные цены
                        </h2>
                        <p class="text-xs text-slate-500">Актуально на ${fuelPrices.updatedAt}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-3">
                            <h3 class="text-sm font-bold text-blue-600 flex items-center gap-2 border-b border-slate-200 pb-1">
                                <i class="fas fa-oil-can"></i> Дизельное топливо
                            </h3>
                            ${fuelPrices.diesel.map(item => `
                                <div class="flex justify-between items-center text-sm">
                                    <span class="text-slate-600">${item.location}</span>
                                    <span class="font-bold text-slate-900">${item.price}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="space-y-3">
                            <h3 class="text-sm font-bold text-blue-600 flex items-center gap-2 border-b border-slate-200 pb-1">
                                <i class="fas fa-gas-pump"></i> Авиатопливо и бензин
                            </h3>
                            ${fuelPrices.aviationAndPetrol.map(item => `
                                <div class="flex justify-between items-center text-sm">
                                    <span class="text-slate-600">${item.name}</span>
                                    <span class="font-bold text-slate-900">${item.price}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <div class="glass-panel p-6 rounded-2xl overflow-hidden">
                    <div class="flex justify-between items-center mb-6 flex-wrap gap-2">
                        <h2 class="text-xl font-semibold text-slate-800"><i class="fas fa-newspaper text-blue-600 mr-2"></i>Свежие новости</h2>
                        <div class="flex gap-2">
                             <button onclick="document.querySelector('.news-slider').scrollBy({left: -300, behavior: 'smooth'})" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center hover:bg-slate-300 transition"><i class="fas fa-chevron-left text-xs"></i></button>
                             <button onclick="document.querySelector('.news-slider').scrollBy({left: 300, behavior: 'smooth'})" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center hover:bg-slate-300 transition"><i class="fas fa-chevron-right text-xs"></i></button>
                        </div>
                    </div>
                    <div class="news-slider">
                        ${getSortedNews().map(item => `
                            <div class="news-slide glass-card overflow-hidden bento-card relative group flex flex-col h-[280px]">
                                <div class="h-32 overflow-hidden">
                                    <img src="${item.img}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
                                </div>
                                <div class="p-4 flex flex-col flex-grow">
                                    <div class="text-[9px] text-blue-600 font-bold mb-1 uppercase tracking-widest">${formatDate(item.date)}</div>
                                    <h3 class="font-bold text-sm mb-1 leading-tight group-hover:text-blue-600 transition-colors line-clamp-2 text-slate-800">${item.title}</h3>
                                    <p class="text-slate-500 text-[11px] line-clamp-2 mb-2">${item.content}</p>
                                    <button data-nav="news" class="mt-auto nav-page-btn text-[10px] text-blue-600 font-semibold flex items-center gap-2 hover:gap-3 transition-all">
                                        Подробнее <i class="fas fa-arrow-right"></i>
                                    </button>
                                </div>
                            </div>
`).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    function renderTanksPage() {
        return `
            <div class="space-y-8">
                <div class="glass-panel p-6 rounded-2xl">
                    <h2 class="text-2xl font-bold flex items-center gap-2 text-slate-800"><i class="fas fa-warehouse text-blue-600"></i> Остатки топлива на нефтебазе</h2>
                    <p class="text-slate-500 text-sm mt-1">Актуальные данные: ${new Date().toLocaleDateString('ru-RU')}</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="tank glass-panel p-5 rounded-xl">
                        <div class="flex justify-between mb-2 text-slate-800"><span class="font-semibold"><i class="fas fa-droplet text-blue-600 mr-1"></i> Резервуар №1 (АИ-92)</span><span class="text-sm text-blue-600" id="fuel1Val">42 500</span></div>
                        <div class="h-28 bg-slate-100 rounded-xl overflow-hidden relative"><div id="fill1" class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-blue-500 to-blue-400 fuel-fill" style="height: 85%"></div><div class="absolute inset-0 flex items-center justify-center text-sm font-bold text-slate-700">85%</div></div>
                    </div>
                    <div class="tank glass-panel p-5 rounded-xl">
                        <div class="flex justify-between mb-2 text-slate-800"><span class="font-semibold"><i class="fas fa-droplet text-sky-600 mr-1"></i> Резервуар №2 (АИ-95)</span><span class="text-sm text-sky-600" id="fuel2Val">31 200</span></div>
                        <div class="h-28 bg-slate-100 rounded-xl overflow-hidden relative"><div id="fill2" class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-sky-500 to-sky-400 fuel-fill" style="height: 62%"></div><div class="absolute inset-0 flex items-center justify-center text-sm font-bold text-slate-700">62%</div></div>
                    </div>
                    <div class="tank glass-panel p-5 rounded-xl">
                        <div class="flex justify-between mb-2 text-slate-800"><span class="font-semibold"><i class="fas fa-droplet text-emerald-600 mr-1"></i> Резервуар №3 (ДТ)</span><span class="text-sm text-emerald-600" id="fuel3Val">48 700</span></div>
                        <div class="h-28 bg-slate-100 rounded-xl overflow-hidden relative"><div id="fill3" class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-emerald-500 to-emerald-400 fuel-fill" style="height: 81%"></div><div class="absolute inset-0 flex items-center justify-center text-sm font-bold text-slate-700">81%</div></div>
                    </div>
                    <div class="tank glass-panel p-5 rounded-xl">
                        <div class="flex justify-between mb-2 text-slate-800"><span class="font-semibold"><i class="fas fa-droplet text-purple-600 mr-1"></i> Резервуар №4 (АИ-98)</span><span class="text-sm text-purple-600" id="fuel4Val">18 600</span></div>
                        <div class="h-28 bg-slate-100 rounded-xl overflow-hidden relative"><div id="fill4" class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-purple-500 to-purple-400 fuel-fill" style="height: 46%"></div><div class="absolute inset-0 flex items-center justify-center text-sm font-bold text-slate-700">46%</div></div>
                    </div>
                </div>
                <div class="glass-panel p-6 rounded-2xl">
                    <h3 class="text-xl font-semibold mb-4 text-slate-800"><i class="fas fa-calculator text-green-600 mr-2"></i>Бернулли үлестірімі (n, p)</h3>
                    <div class="grid md:grid-cols-2 gap-5 mb-6">
                        <div><label class="block text-sm text-slate-500 mb-1">Сынақтар саны (n)</label><input type="number" id="bernoulliN" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2" value="10"></div>
                        <div><label class="block text-sm text-slate-500 mb-1">Табыс ықтималдығы (p)</label><input type="number" step="0.1" min="0" max="1" id="bernoulliP" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-2" value="0.5"></div>
                    </div>
                    <div class="chart-container"><canvas id="bernoulliChart"></canvas></div>
                </div>
            </div>
        `;
    }

    function renderAboutPage() {
        return `
            <div class="space-y-6">
                <div class="glass-panel p-8 rounded-2xl">
                    <div class="text-center mb-8"><h1 class="text-5xl font-bold gradient-text">Mercury</h1><p class="text-slate-600 mt-2 italic">From the endless steppes to the eternal sky</p></div>
                    <div class="grid md:grid-cols-2 gap-8 items-center">
                        <div><h2 class="text-2xl font-semibold text-blue-600 mb-4">О компании</h2><p class="text-slate-600 leading-relaxed text-sm">Mercury — один из ведущих поставщиков авиационного топлива в Казахстане. Инфраструктура соответствует международным стандартам Joint Inspection Group (JIG 2).</p></div>
                        <div class="rounded-2xl overflow-hidden shadow-lg"><img src="https://mercuryenergy.kz/22.jpg" class="w-full h-64 object-cover"></div>
                    </div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="glass-panel p-6 text-center bento-card"><div class="text-3xl font-bold text-blue-600 mb-1">19 000</div><div class="text-[10px] text-slate-500 uppercase">м³ объём хранения</div></div>
                    <div class="glass-panel p-6 text-center bento-card"><div class="text-3xl font-bold text-blue-600 mb-1">13</div><div class="text-[10px] text-slate-500 uppercase">резервуаров</div></div>
                    <div class="glass-panel p-6 text-center bento-card"><div class="text-3xl font-bold text-blue-600 mb-1">2018</div><div class="text-[10px] text-slate-500 uppercase">год запуска</div></div>
                    <div class="glass-panel p-6 text-center bento-card"><div class="text-3xl font-bold text-blue-600 mb-1">6 км</div><div class="text-[10px] text-slate-500 uppercase">до аэропорта</div></div>
                </div>
                <div class="glass-panel p-8 rounded-2xl">
                    <h3 class="text-2xl font-semibold mb-8 text-center text-blue-600">Руководство</h3>
                    <div class="grid md:grid-cols-3 gap-8 text-slate-800">
                        <div class="text-center"><div class="w-24 h-24 mx-auto mb-4 rounded-full overflow-hidden border-2 border-slate-200"><img src="https://mercuryenergy.kz/ssaya.jpeg" class="w-full h-full object-cover"></div><h4 class="font-bold">Максат Аканович</h4><p class="text-xs text-slate-500 mt-1">Генеральный директор</p></div>
                        <div class="text-center"><div class="w-24 h-24 mx-auto mb-4 rounded-full overflow-hidden border-2 border-slate-200"><img src="https://mercuryenergy.kz/ttagatt.jpg" class="w-full h-full object-cover"></div><h4 class="font-bold">Талгат Тажибаев</h4><p class="text-xs text-slate-500 mt-1">Главный инженер</p></div>
                        <div class="text-center"><div class="w-24 h-24 mx-auto mb-4 rounded-full overflow-hidden border-2 border-slate-200"><img src="https://mercuryenergy.kz/vvera.jpg" class="w-full h-full object-cover"></div><h4 class="font-bold">Вера Шашкова</h4><p class="text-xs text-slate-500 mt-1">Руководитель лаборатории</p></div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderNewsPage() {
        return `
            <div class="space-y-6">
                <div class="flex flex-wrap justify-between items-center gap-3 text-slate-800"><h2 class="text-2xl font-bold"><i class="fas fa-newspaper text-blue-600 mr-2"></i>Новости компании</h2><div class="flex gap-2 text-sm bg-slate-100 p-1 rounded-full"><button data-news-sort="newest" class="sort-news-btn px-3 py-1 rounded-full ${newsSortMode === 'newest' ? 'bg-blue-600 text-white' : 'text-slate-500'}">Новые</button><button data-news-sort="oldest" class="sort-news-btn px-3 py-1 rounded-full ${newsSortMode === 'oldest' ? 'bg-blue-600 text-white' : 'text-slate-500'}">Старые</button><button data-news-sort="trending" class="sort-news-btn px-3 py-1 rounded-full ${newsSortMode === 'trending' ? 'bg-blue-600 text-white' : 'text-slate-500'}">Тренды</button></div></div>
                <div class="grid gap-6 md:grid-cols-2">
                    ${getSortedNews().map(item => `
                        <div class="glass-panel overflow-hidden bento-card flex flex-col"><div class="h-48 overflow-hidden"><img src="${item.img}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110"></div><div class="p-5 flex flex-col flex-grow"><div class="flex justify-between items-center mb-3"><span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full uppercase tracking-tighter">📅 ${formatDate(item.date)}</span><span class="text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full">🔥 ${item.trending}</span></div><h3 class="font-bold text-lg mb-2 leading-tight text-slate-800">${item.title}</h3><p class="text-slate-500 text-sm line-clamp-3 mb-4">${item.content}</p></div></div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function renderPricesPage() {
        return `
            <div class="space-y-6">
                <h2 class="text-2xl font-bold text-center text-slate-800"><i class="fas fa-tags text-blue-600 mr-2"></i>Топливные цены</h2>
                <p class="text-center text-slate-500">Актуально на ${fuelPrices.updatedAt}</p>
                <div class="grid md:grid-cols-2 gap-5">
                    <div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-blue-600 mb-4"><i class="fas fa-oil-can mr-2"></i>Дизельное топливо</h3><div class="space-y-2">${fuelPrices.diesel.map(item => `<div class="flex justify-between py-2 border-b border-slate-100 text-slate-600"><span>${item.location}</span><span class="font-bold text-slate-900">${item.price}</span></div>`).join('')}</div></div>
                    <div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-sky-600 mb-4"><i class="fas fa-gas-pump mr-2"></i>Авиатопливо и бензин</h3><div class="space-y-2">${fuelPrices.aviationAndPetrol.map(item => `<div class="flex justify-between py-2 border-b border-slate-100 text-slate-600"><span>${item.name}</span><span class="font-bold text-slate-900">${item.price}</span></div>`).join('')}</div></div>
                </div>
            </div>
        `;
    }

    function renderContactsPage() {
        return `
            <div class="glass-panel p-8 rounded-2xl">
                <div class="text-center mb-10"><h2 class="text-3xl font-bold gradient-text">Свяжитесь с нами</h2><p class="text-slate-500 mt-2">Мы всегда на связи для решения ваших задач</p></div>
                <div class="grid md:grid-cols-2 gap-10">
                    <div class="space-y-6">
                        <div class="flex items-start gap-4"><div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center flex-shrink-0"><i class="fas fa-location-dot text-blue-600"></i></div><div><h4 class="font-bold text-slate-800">Адрес нефтебазы</h4><p class="text-sm text-slate-500">г. Алматы, Турксибский район, ул. Свободная 136/2</p></div></div>
                        <div class="flex items-start gap-4"><div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center flex-shrink-0"><i class="fas fa-phone text-blue-600"></i></div><div><h4 class="font-bold text-slate-800">Телефон</h4><a href="tel:+77273132596" class="text-sm text-blue-600 hover:underline">+7 (727) 313 25 96</a></div></div>
                    </div>
                    <div class="space-y-6 text-slate-600">
                        <div class="flex items-start gap-4"><div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center flex-shrink-0"><i class="fas fa-clock text-blue-600"></i></div><div><h4 class="font-bold text-slate-800">Режим работы</h4><p class="text-sm">Круглосуточно, 24/7</p></div></div>
                        <div class="bg-slate-50 p-4 rounded-xl flex items-center gap-3"><i class="fas fa-plane-arrival text-blue-600"></i><p class="text-xs">Расстояние до аэропорта Алматы — <span class="font-bold text-slate-800">6 км</span></p></div>
                    </div>
                </div>
                <div class="mt-10 rounded-2xl overflow-hidden border border-slate-200 h-64 grayscale opacity-80"><iframe src="https://yandex.kz/map-widget/v1/?ll=77.003968%2C43.348314&mode=search&oid=98395703974&ol=biz&z=14" width="100%" height="100%" frameborder="0"></iframe></div>
            </div>
        `;
    }

    let bernoulliChart = null;
    function initBernoulliChart() {
        const ctx = document.getElementById('bernoulliChart')?.getContext('2d'); if (!ctx) return;
        const n = parseInt(document.getElementById('bernoulliN').value) || 0; const p = parseFloat(document.getElementById('bernoulliP').value) || 0;
        const k_vals = Array.from({length: n + 1}, (_, i) => i); const probs = k_vals.map(k => bernoulliProbability(n, k, p));
        if (bernoulliChart) bernoulliChart.destroy();
        bernoulliChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: k_vals,
                datasets: [{
                    label: `P(X=k)`,
                    data: probs,
                    backgroundColor: 'rgba(59, 130, 246, 0.6)',
                    borderColor: 'rgba(59, 130, 246, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        ticks: { color: '#64748b' }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#64748b' }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#1e293b' } }
                }
            }
        });
    }

    function renderPage(pageId) {
        const content = document.getElementById('pageContent');
        if (pageId === 'home') content.innerHTML = renderHome();
        else if (pageId === 'tanks') { content.innerHTML = renderTanksPage(); initBernoulliChart(); document.getElementById('bernoulliN').addEventListener('input', initBernoulliChart); document.getElementById('bernoulliP').addEventListener('input', initBernoulliChart); }
        else if (pageId === 'about') content.innerHTML = renderAboutPage();
        else if (pageId === 'news') content.innerHTML = renderNewsPage();
        else if (pageId === 'prices') content.innerHTML = renderPricesPage();
        else if (pageId === 'contacts') content.innerHTML = renderContactsPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('click', (e) => {
        const navBtn = e.target.closest('[data-nav], .nav-page-btn');
        if (navBtn) {
            e.preventDefault();
            const target = navBtn.getAttribute('data-nav');
            if (target) renderPage(target);
        }

        const sortBtn = e.target.closest('[data-news-sort]');
        if (sortBtn) {
            newsSortMode = sortBtn.getAttribute('data-news-sort');
            renderPage('news');
        }
    });

    document.getElementById('homeButton')?.addEventListener('click', () => renderPage('home'));

    renderPage('home');
</script>
</body>
</html>
