<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mercury Energy | SmartME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: #f1f5f9;
            min-height: 100vh;
            color: #1e293b;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 2rem;
            box-shadow: 0 4px 20px 0 rgba(0,0,0,0.05);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 1.5rem;
        }
        .bento-card {
            transition: all 0.2s ease-out;
        }
        .bento-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.95);
            border-color: rgba(59, 130, 246, 0.3);
        }
        .nav-btn, .primary-btn {
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .nav-btn:active, .primary-btn:active {
            transform: scale(0.96);
        }
        .page {
            animation: fadeSlideUp 0.35s ease-out;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(12px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .news-carousel {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .news-carousel::-webkit-scrollbar {
            height: 6px;
        }
        .news-carousel::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
        }
        .news-carousel::-webkit-scrollbar-thumb {
            background: rgba(59,130,246,0.3);
            border-radius: 10px;
        }
        .tank {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .tank:hover {
            transform: translateY(-5px);
        }
        .fuel-fill {
            transition: height 0.5s ease-out;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }
        .gradient-text {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .home-btn {
            background: linear-gradient(135deg, rgba(59,130,246,0.1), rgba(139,92,246,0.1));
            border: 1px solid rgba(59,130,246,0.2);
            color: #1e40af;
        }
        .home-btn:hover {
            background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(139,92,246,0.2));
            border-color: rgba(59,130,246,0.4);
        }
        .small-nav-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0,0,0,0.1);
            color: #475569;
            transition: all 0.2s;
        }
        .small-nav-btn:hover {
            background: rgba(59,130,246,0.1);
            border-color: rgba(59,130,246,0.3);
            color: #2563eb;
            transform: translateY(-2px);
        }
        .hero-bg {
            background-image: url('https://mercuryenergy.kz/11.jpg');
            background-size: cover;
            background-position: center;
        }
        .news-slider {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 1.5rem;
            padding: 0.5rem 0 1.5rem 0;
            scrollbar-width: none;
        }
        .news-slider::-webkit-scrollbar {
            display: none;
        }
        .news-slide {
            flex: 0 0 85%;
            scroll-snap-align: start;
        }
        @media (min-width: 768px) {
            .news-slide {
                flex: 0 0 31%;
            }
        }
        .chart-container canvas {
            max-height: 250px;
            width: 100%;
        }
        .hamburger-line { background-color: #1e293b !important; }
    </style>
</head>
<body class="antialiased">
<div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 relative">

                <span class="hidden sm:inline">АЗС / Нефтебаза</span>

            <a href="https://mercuryenergy.kz" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1 bg-white/50 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-medium border border-gray-200 hover:bg-white/80 transition-all nav-btn text-gray-700">
                <i class="fas fa-external-link-alt text-xs"></i>

    <div id="menuOverlay" class="fixed inset-0 bg-white/80 backdrop-blur-md z-40 transition-all duration-300 transform -translate-x-full">

                <div class="text-2xl font-bold gradient-text">Mercury Energy</div>
                <button id="closeMenuBtn" class="text-gray-400 hover:text-gray-900 text-2xl">&times;</button>
            </div>
            <nav class="flex flex-col gap-3 text-base text-gray-700">
                <a href="#" data-nav="home" class="menu-link py-2.5 px-4 rounded-xl hover:bg-blue-50 transition flex items-center gap-3"><i class="fas fa-home w-5 text-blue-500"></i> Главная</a>
                <a href="#" data-nav="tanks" class="menu-link py-2.5 px-4 rounded-xl hover:bg-blue-50 transition flex items-center gap-3"><i class="fas fa-oil-can w-5 text-blue-500"></i> АЗС / Нефтебаза</a>
                <a href="#" data-nav="about" class="menu-link py-2.5 px-4 rounded-xl hover:bg-blue-50 transition flex items-center gap-3"><i class="fas fa-building w-5 text-blue-500"></i> О компании</a>
                <a href="#" data-nav="news" class="menu-link py-2.5 px-4 rounded-xl hover:bg-blue-50 transition flex items-center gap-3"><i class="fas fa-newspaper w-5 text-blue-500"></i> Новости</a>

                <hr class="border-gray-100 my-2">
                <a href="https://mercuryenergy.kz" target="_blank" class="py-2.5 px-4 rounded-xl hover:bg-blue-50 transition flex items-center gap-3"><i class="fas fa-globe w-5 text-blue-500"></i> mercuryenergy.kz →</a>
            </nav>
        </div>
    </div>
    <main id="pageContent" class="page"></main>
</div>
<script>
    const fuelPrices = {
        "АИ-92": 225,
        "АИ-95": 235,
        "ДТ": 285
    };

    const newsArchive = [
        { id: 2, title: "Практика студентов КазНУ", content: "Студенты 4-го курса КазНУ им. Аль-Фараби успешно прошли практику на нефтебазе.", date: "2026-04-30", trending: 88, img: "https://mercuryenergy.kz/upload/iblock/d7a/KZNU.jpeg" },
        { id: 3, title: "Расширение парка бензовозов", content: "Приобретено 5 новых современных бензовозов Scania для повышения эффективности логистики.", date: "2025-12-10", trending: 85, img: "https://mercuryenergy.kz/upload/iblock/d7a/news_3.jpg" },
        { id: 1, title: "Модернизация нефтебазы JIG", content: "Поэтапная модернизация в соответствии с международными стандартами JIG 2 (issue 13, 2021).", date: "2025-04-20", trending: 92, img: "https://mercuryenergy.kz/upload/iblock/d7a/news.jpg" },
        { id: 4, title: "Запуск Smart АЗС ION Energy", content: "Инновационный проект 'умных' АЗС на модульной основе с цифровыми решениями.", date: "2025-03-15", trending: 94, img: "https://mercuryenergy.kz/upload/iblock/4b9/AZSION2.png" }
    ];

    let newsSortMode = 'newest';
    function formatDate(dateStr) { const d = new Date(dateStr); return `${d.getDate()} ${['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()]} ${d.getFullYear()}`; }

    function getSortedNews() {
        let arr = [...newsArchive];
        if (newsSortMode === 'newest') arr.sort((a,b) => new Date(b.date) - new Date(a.date));
        else if (newsSortMode === 'oldest') arr.sort((a,b) => new Date(a.date) - new Date(b.date));
        else arr.sort((a,b) => b.trending - a.trending);
        return arr;
    }

    function combinations(n, k) { if (k < 0 || k > n) return 0; if (k === 0 || k === n) return 1; if (k > n / 2) k = n - k; let res = 1; for (let i = 1; i <= k; i++) res = res * (n - i + 1) / i; return Math.round(res); }
    function bernoulliProbability(n, k, p) { return combinations(n, k) * Math.pow(p, k) * Math.pow(1 - p, n - k); }

    function renderHome() {
        return `
            <div class="space-y-6">
                <div class="relative rounded-3xl overflow-hidden h-32 md:h-36 glass-card flex items-center justify-center hero-bg">
                    <div class="absolute inset-0 bg-white/60 backdrop-blur-[1px]"></div>
                    <div class="relative z-10 text-center px-4">
                        <h1 class="text-4xl md:text-5xl font-bold gradient-text">Mercury</h1>
                        <p class="text-gray-700 text-[10px] md:text-xs italic mb-1">From the endless steppes to the eternal sky</p>
                        <div class="flex flex-wrap justify-center gap-1 text-[8px] sm:text-[10px] text-gray-600">
                            <span class="bg-white/40 border border-gray-200/50 px-2 py-0.5 rounded-full backdrop-blur-md">Нефтебаза в Алматы</span>
                            <span class="bg-white/40 border border-gray-200/50 px-2 py-0.5 rounded-full backdrop-blur-md">Авиатопливо</span>
                            <span class="bg-white/40 border border-gray-200/50 px-2 py-0.5 rounded-full backdrop-blur-md">Хранение 19 000 м³</span>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="glass-card p-4 text-center"><div class="text-[10px] text-gray-400 uppercase">АИ-92</div><div class="text-xl font-bold text-blue-600">${fuelPrices["АИ-92"]} ₸</div></div>
                    <div class="glass-card p-4 text-center"><div class="text-[10px] text-gray-400 uppercase">АИ-95</div><div class="text-xl font-bold text-blue-600">${fuelPrices["АИ-95"]} ₸</div></div>
                    <div class="glass-card p-4 text-center"><div class="text-[10px] text-gray-400 uppercase">ДТ</div><div class="text-xl font-bold text-blue-600">${fuelPrices["ДТ"]} ₸</div></div>
                </div>
                <div class="glass-panel p-6 rounded-2xl">
                    <div class="flex justify-between items-center mb-6"><h2 class="text-xl font-semibold flex items-center gap-2"><i class="fas fa-newspaper text-blue-500"></i> Свежие новости</h2><div class="flex gap-2"><button onclick="document.querySelector('.news-slider').scrollBy({left: -300, behavior: 'smooth'})" class="w-8 h-8 rounded-full bg-black/5 flex items-center justify-center hover:bg-black/10 transition"><i class="fas fa-chevron-left text-xs"></i></button><button onclick="document.querySelector('.news-slider').scrollBy({left: 300, behavior: 'smooth'})" class="w-8 h-8 rounded-full bg-black/5 flex items-center justify-center hover:bg-black/10 transition"><i class="fas fa-chevron-right text-xs"></i></button></div></div>
                    <div class="news-slider">
                        ${getSortedNews().slice(0, 3).map(item => `
                            <div class="news-slide glass-card overflow-hidden bento-card relative flex flex-col h-[290px]">
                                <div class="h-36 overflow-hidden"><img src="${item.img}" class="w-full h-full object-cover"></div>
                                <div class="p-4 flex flex-col flex-grow">
                                    <div class="text-[9px] text-blue-500 font-bold mb-1 uppercase">${formatDate(item.date)}</div>
                                    <h3 class="font-bold text-sm mb-1 leading-tight line-clamp-2">${item.title}</h3>
                                    <p class="text-gray-500 text-[11px] line-clamp-2 mb-2">${item.content}</p>
                                    <button data-nav="news" class="mt-auto text-[10px] text-blue-600 font-semibold flex items-center gap-1">Подробнее <i class="fas fa-arrow-right"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        `;
    }

    function renderTanksPage() {
        return `
            <div class="space-y-8">
                <div class="glass-panel p-6 rounded-2xl"><h2 class="text-2xl font-bold flex items-center gap-2"><i class="fas fa-warehouse text-blue-500"></i> Остатки на нефтебазе</h2></div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="tank glass-panel p-5 rounded-xl"><div class="flex justify-between mb-2"><span class="font-semibold text-gray-700">Резервуар №1 (АИ-92)</span><span class="text-sm text-blue-600">42 500</span></div><div class="h-28 bg-gray-100 rounded-xl overflow-hidden relative"><div class="absolute bottom-0 left-0 w-full bg-blue-500 fuel-fill" style="height: 85%"></div></div></div>
                    <div class="tank glass-panel p-5 rounded-xl"><div class="flex justify-between mb-2"><span class="font-semibold text-gray-700">Резервуар №2 (АИ-95)</span><span class="text-sm text-sky-600">31 200</span></div><div class="h-28 bg-gray-100 rounded-xl overflow-hidden relative"><div class="absolute bottom-0 left-0 w-full bg-sky-500 fuel-fill" style="height: 62%"></div></div></div>
                </div>
                <div class="glass-panel p-6 rounded-2xl">
                    <h3 class="text-xl font-semibold mb-4 text-gray-800">Бернулли үлестірімі</h3>
                    <div class="grid md:grid-cols-2 gap-5 mb-6">
                        <div><label class="block text-sm text-gray-600 mb-1">n</label><input type="number" id="bernoulliN" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2" value="10"></div>
                        <div><label class="block text-sm text-gray-600 mb-1">p</label><input type="number" step="0.1" id="bernoulliP" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2" value="0.5"></div>
                    </div>
                    <div class="chart-container"><canvas id="bernoulliChart"></canvas></div>
                </div>
            </div>
        `;
    }

    function renderAboutPage() {
        return `
            <div class="space-y-6">
                <div class="glass-panel p-8 rounded-2xl">
                    <div class="text-center mb-8"><h1 class="text-4xl font-bold gradient-text">Mercury Energy</h1><p class="text-gray-500 mt-2 italic">From the endless steppes to the eternal sky</p></div>
                    <div class="grid md:grid-cols-2 gap-8 items-center">
                        <div><h2 class="text-2xl font-semibold text-blue-600 mb-4">О компании</h2><p class="text-gray-600 leading-relaxed text-sm">Mercury Energy — ведущий поставщик авиатоплива в Казахстане. Инфраструктура соответствует международным стандартам JIG 2.</p></div>
                        <div class="rounded-2xl overflow-hidden shadow-lg"><img src="https://mercuryenergy.kz/22.jpg" class="w-full h-64 object-cover"></div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderNewsPage() {
        return `
            <div class="space-y-6">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <h2 class="text-2xl font-bold text-gray-800">Новости компании</h2>
                    <div class="flex gap-2 p-1 bg-gray-100 rounded-xl">
                        <button onclick="setNewsSort('newest')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${newsSortMode==='newest'?'bg-white shadow-sm text-blue-600':'text-gray-500 hover:text-gray-700'}">Новые</button>
                        <button onclick="setNewsSort('oldest')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${newsSortMode==='oldest'?'bg-white shadow-sm text-blue-600':'text-gray-500 hover:text-gray-700'}">Старые</button>
                        <button onclick="setNewsSort('trending')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${newsSortMode==='trending'?'bg-white shadow-sm text-blue-600':'text-gray-500 hover:text-gray-700'}">Тренды</button>
                    </div>
                </div>
                <div class="grid gap-6 md:grid-cols-2">
                    ${getSortedNews().map(item => `
                        <div class="glass-panel overflow-hidden flex flex-col"><img src="${item.img}" class="h-48 w-full object-cover"><div class="p-5"><div class="text-xs text-blue-500 mb-2">${formatDate(item.date)}</div><h3 class="font-bold text-lg mb-2">${item.title}</h3><p class="text-gray-600 text-sm">${item.content}</p></div></div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function setNewsSort(mode) {
        newsSortMode = mode;
        renderPage('news');
    }

    function renderPricesPage() {
        return `
            <div class="space-y-6">
                <div class="glass-panel p-6 rounded-2xl"><h2 class="text-2xl font-bold flex items-center gap-2"><i class="fas fa-tags text-blue-500"></i> Цены на топливо</h2></div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="glass-panel p-6 rounded-2xl">
                        <h3 class="font-bold text-blue-600 mb-4 border-b pb-2">Нефтебаза Алматы</h3>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center text-sm"><span>АИ-92</span><span class="font-bold">${fuelPrices["АИ-92"]} ₸/л</span></div>
                            <div class="flex justify-between items-center text-sm"><span>АИ-95</span><span class="font-bold">${fuelPrices["АИ-95"]} ₸/л</span></div>
                            <div class="flex justify-between items-center text-sm"><span>ДТ</span><span class="font-bold">${fuelPrices["ДТ"]} ₸/л</span></div>
                        </div>
                    </div>
                    <div class="glass-panel p-6 rounded-2xl">
                        <h3 class="font-bold text-blue-600 mb-4 border-b pb-2">АЗС №1 (Трасса)</h3>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center text-sm"><span>АИ-92</span><span class="font-bold">220 ₸/л</span></div>
                            <div class="flex justify-between items-center text-sm"><span>АИ-95</span><span class="font-bold">230 ₸/л</span></div>
                            <div class="flex justify-between items-center text-sm"><span>ДТ</span><span class="font-bold">280 ₸/л</span></div>
                        </div>
                    </div>
                    <div class="glass-panel p-6 rounded-2xl">
                        <h3 class="font-bold text-blue-600 mb-4 border-b pb-2">АЗС №2 (Город)</h3>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center text-sm"><span>АИ-92</span><span class="font-bold">225 ₸/л</span></div>
                            <div class="flex justify-between items-center text-sm"><span>АИ-95</span><span class="font-bold">235 ₸/л</span></div>
                            <div class="flex justify-between items-center text-sm"><span>ДТ</span><span class="font-bold">285 ₸/л</span></div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderContactsPage() {
        return `
            <div class="glass-panel p-8 rounded-2xl text-center">
                <h2 class="text-2xl font-bold text-gray-800 mb-4">Контакты</h2>
                <p class="text-gray-600">г. Алматы, Турксибский район, ул. Свободная 136/2</p>
                <p class="text-blue-600 font-bold mt-2">+7 (727) 313 25 96</p>
            </div>
        `;
    }

    let bernoulliChart = null;
    function initBernoulliChart() {
        const ctx = document.getElementById('bernoulliChart')?.getContext('2d'); if (!ctx) return;
        const n = parseInt(document.getElementById('bernoulliN').value) || 0; const p = parseFloat(document.getElementById('bernoulliP').value) || 0;
        const k_vals = Array.from({length: n + 1}, (_, i) => i); const probs = k_vals.map(k => bernoulliProbability(n, k, p));
        if (bernoulliChart) bernoulliChart.destroy();
        bernoulliChart = new Chart(ctx, { type: 'bar', data: { labels: k_vals, datasets: [{ label: `P(X=k)`, data: probs, backgroundColor: 'rgba(59, 130, 246, 0.6)' }] }, options: { responsive: true, maintainAspectRatio: false } });
    }

    function renderPage(pageId) {
        if (pageId === 'home') document.getElementById('pageContent').innerHTML = renderHome();
        else if (pageId === 'tanks') { document.getElementById('pageContent').innerHTML = renderTanksPage(); initBernoulliChart(); document.getElementById('bernoulliN').addEventListener('input', initBernoulliChart); document.getElementById('bernoulliP').addEventListener('input', initBernoulliChart); }
        else if (pageId === 'about') document.getElementById('pageContent').innerHTML = renderAboutPage();
        else if (pageId === 'news') document.getElementById('pageContent').innerHTML = renderNewsPage();
        else if (pageId === 'prices') document.getElementById('pageContent').innerHTML = renderPricesPage();
        else if (pageId === 'contacts') document.getElementById('pageContent').innerHTML = renderContactsPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    const menuOverlay = document.getElementById('menuOverlay');
    function closeMenu() { menuOverlay.style.transform = 'translateX(-100%)'; }
    function openMenu() { menuOverlay.style.transform = 'translateX(0%)'; }

    document.addEventListener('click', (e) => {
        const navBtn = e.target.closest('[data-nav]');
        if (navBtn) {
            e.preventDefault();
            renderPage(navBtn.getAttribute('data-nav'));
            closeMenu();
        }
    });

    document.getElementById('hamburgerBtn')?.addEventListener('click', openMenu);
    document.getElementById('closeMenuBtn')?.addEventListener('click', closeMenu);

    renderPage('home');
</script>
</body>
</html>
