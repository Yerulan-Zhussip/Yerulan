    // ========== HELPER FUNCTIONS ==========
    /**
     * Вычисляет число сочетаний из n по k (биномиальный коэффициент).
     * Формула: C(n, k) = n! / (k!(n-k)!)
     * Используется для определения количества способов выбора k успехов в n испытаниях.
     */
    function combinations(n, k) {
        if (k < 0 || k > n) return 0;
        if (k === 0 || k === n) return 1;
        if (k > n / 2) k = n - k;
        let res = 1;
        for (let i = 1; i <= k; i++) {
            res = res * (n - i + 1) / i;
        }
        return Math.round(res);
    }

    /**
     * Вычисляет вероятность по формуле Бернулли.
     * Формула: P(X=k) = C(n, k) * p^k * (1-p)^(n-k)
     * n - общее количество независимых испытаний
     * k - количество успехов
     * p - вероятность успеха в одном испытании
     */
    function bernoulliProbability(n, k, p) {
        // P(X=k) = число сочетаний * (вероятность успеха)^k * (вероятность неудачи)^(n-k)
        return combinations(n, k) * Math.pow(p, k) * Math.pow(1 - p, n - k);
    }

    // ========== ФУНКЦИЯ ОТРИСОВКИ ГРАФИКА БЕРНУЛЛИ ==========
    let bernoulliChart = null;
    function initBernoulliChart() {
        const ctx = document.getElementById('bernoulliChart')?.getContext('2d');
        if (!ctx) return;

        const n = parseInt(document.getElementById('bernoulliN').value) || 0;
        const p = parseFloat(document.getElementById('bernoulliP').value) || 0;

        const k_values = Array.from({length: n + 1}, (_, i) => i);
        const probabilities = k_values.map(k => bernoulliProbability(n, k, p));

        if (bernoulliChart) bernoulliChart.destroy();
        bernoulliChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: k_values,
                datasets: [{
                    label: `P(X=k) (n=${n}, p=${p})`,
                    data: probabilities,
                    backgroundColor: 'rgba(239, 68, 68, 0.6)',
                    borderColor: 'rgba(239, 68, 68, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#ccc' } },
                    x: { grid: { display: false }, ticks: { color: '#ccc' } }
                },
                plugins: { legend: { labels: { color: '#ccc' } } }
            }
        });
    }

    // ========== ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ ==========
    function renderPage(pageId, extra = null) {
        const prevPage = currentPage;
        currentPage = pageId;
        if (pageId === 'home') {
            document.getElementById('pageContent').innerHTML = renderHome();
            attachHomeEvents();
        } else if (pageId === 'tanks') {
            document.getElementById('pageContent').innerHTML = renderTanksPage();
            initBernoulliChart();
            attachTankCalculator();
        } else if (pageId === 'about') {
            document.getElementById('pageContent').innerHTML = renderAboutPage();
        } else if (pageId === 'news') {
            document.getElementById('pageContent').innerHTML = renderNewsPage();
            attachNewsEvents();
        } else if (pageId === 'news-detail') {
            document.getElementById('pageContent').innerHTML = renderNewsDetail(extra, prevPage);
        } else if (pageId === 'prices') {
            document.getElementById('pageContent').innerHTML = renderPricesPage();
        } else if (pageId === 'contacts') {
            document.getElementById('pageContent').innerHTML = renderContactsPage();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function attachHomeEvents() {
        document.querySelectorAll('.nav-page-btn, [data-nav]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = btn.getAttribute('data-nav');
                if (target && target !== 'home') renderPage(target);
                closeMenu();
                e.preventDefault();
            });
        });
    }

    function attachTankCalculator() {
        const nInput = document.getElementById('bernoulliN');
        const pInput = document.getElementById('bernoulliP');
        if (nInput && pInput) {
            nInput.addEventListener('input', initBernoulliChart);
            pInput.addEventListener('input', initBernoulliChart);
        }
    }

    function attachNewsEvents() {
        document.querySelectorAll('.sort-news-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const sortVal = btn.getAttribute('data-news-sort');
                if (sortVal) {
                    newsSortMode = sortVal;
                    renderPage('news');
                }
            });
        });
    }

    // Меню и кнопки
    const menuOverlay = document.getElementById('menuOverlay');
    function closeMenu() { menuOverlay.style.transform = 'translateX(-100%)'; document.body.style.overflow = ''; }
    function openMenu() { menuOverlay.style.transform = 'translateX(0%)'; document.body.style.overflow = 'hidden'; }
    document.getElementById('hamburgerBtn')?.addEventListener('click', openMenu);
    document.getElementById('closeMenuBtn')?.addEventListener('click', closeMenu);
    menuOverlay.addEventListener('click', (e) => { if (e.target === menuOverlay) closeMenu(); });
    document.querySelectorAll('.menu-link').forEach(link => {
        link.addEventListener('click', (e) => {
            const target = link.getAttribute('data-nav');
            if (target) renderPage(target);
            closeMenu();
            e.preventDefault();
        });
    });
    document.getElementById('homeButton')?.addEventListener('click', () => { renderPage('home'); closeMenu(); });
